name: Azure Deployment for Telegram Bot

on:
  push:
    branches:
      - main  # Triggers on push to the main branch

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}  # The Azure App Service name
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}  # ACR name
  AZURE_CONTAINER_IMAGE: buffalobuffbot  # Name of the Docker image
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}  # The Azure Resource Group

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout the code from the GitHub repository
    - uses: actions/checkout@v4

    # Step 2: Set up Docker Buildx for multi-platform builds (if needed)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Step 3: Set up Python 3.11 environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # Step 4: Log in to Azure Container Registry (ACR)
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    # Step 5: Build and push Docker image to ACR
    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_CONTAINER_IMAGE }}:${{ github.sha }} .
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_CONTAINER_IMAGE }}:${{ github.sha }}

    # Step 6: Log in to Azure using the Service Principal
    - uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Step 7: Deploy the image to Azure Web App for Containers
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_CONTAINER_IMAGE }}:${{ github.sha }}
        resource-group: ${{ env.AZURE_RESOURCE_GROUP }}

    # Step 8: Logout from Azure
    - name: Logout from Azure
      run: |
        az logout